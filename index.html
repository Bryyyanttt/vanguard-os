<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard Matrix OS</title>
    <!-- Collegamento alla tua PWA -->
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- QUI VA IL TUO CODICE HTML DELLA DASHBOARD -->
    <h1>Vanguard Dashboard</h1>
    <div id="display-dati">In attesa di dati...</div>
    <button onclick="inviaModifica()">Simula Modifica Dati</button>

    <script>
        // 1. Connessione WebSocket
        const socket = new WebSocket(`ws://${window.location.hostname}:8080`);

        socket.onopen = () => console.log("Connesso al server!");

        // 2. RICEZIONE: Quando il server manda i dati, aggiorniamo la pagina
        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === 'matrix_broadcast') {
                console.log("Dati ricevuti, aggiornamento in corso...");
                
                // AGGIORNA QUI: Metti qui il codice che aggiorna i tuoi grafici/testi
                document.getElementById('display-dati').innerText = JSON.stringify(data.payload);
            }
        };

        // 3. INVIO: Funzione da chiamare quando cambi qualcosa nella dashboard
        function inviaModifica(nuoviDati) {
            // Se non passi dati, ne crea uno di test
            const payload = nuoviDati || { valore: Math.random() };
            
            const messaggio = {
                type: 'matrix_broadcast',
                payload: payload
            };

            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(messaggio));
            }
        }

        // Registrazione Service Worker per PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('PWA Service Worker registrato'));
        }
    </script>
</body>
</html>
